# Begin /etc/nsswitch.conf
# Oh My Zsh GX: modified copy of etc/nsswitch.conf from MSYS2 filesystem 2026.03.06-1.
# GX takes the home directory from HOME first (USERPROFILE when HOME is unset), then
# the Windows profile, as in Git for Windows, so ssh and other passwd readers use the
# same home as the shell.

passwd: files db
group: files db

db_enum: cache builtin

db_home: env windows cygwin desc
db_shell: cygwin desc
db_gecos: cygwin desc

# End /etc/nsswitch.conf
